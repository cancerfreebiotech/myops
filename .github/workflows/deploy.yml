name: Deploy to Vercel

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      # 每一碼上限都是 9：patch 滿 9 進 minor、minor 滿 9 進 major。
      # 原本只有 patch 會進位，所以 0.9.9 的下一版變成 0.10.0（應為 1.0.0）。
      # MINOR -gt 9 那條是為了讓已經跑掉的 0.10.x 在下一版收斂回 1.0.0；
      # 收斂之後就只會走 -eq 9 那條，不再有大於 9 的 minor。
      - name: Bump version (each digit caps at 9, then carries)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MINOR=$(node -p "require('./package.json').version.split('.')[1]")
          PATCH=$(node -p "require('./package.json').version.split('.')[2]")
          if [ "$MINOR" -gt 9 ] || { [ "$MINOR" -eq 9 ] && [ "$PATCH" -ge 9 ]; }; then
            npm version major --no-git-tag-version
          elif [ "$PATCH" -ge 9 ]; then
            npm version minor --no-git-tag-version
          else
            npm version patch --no-git-tag-version
          fi
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
